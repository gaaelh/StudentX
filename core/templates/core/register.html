
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentX | Create Account</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">

    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            min-height: 100vh;
        }

        .register-section {
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .register-card {
            background: #111111;
            border: 1px solid #252525;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 460px;
        }

        .register-card h1 {
            font-weight: 700;
            font-size: 32px;
        }

        .register-subtitle {
            color: #999;
            margin-bottom: 30px;
        }

        .register-card label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .register-card input {
            width: 100%;
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px;
            color: white;
            margin-bottom: 15px;
        }

        .register-card input:focus {
            outline: none;
            border-color: #ffffff;
        }

        .register-card .helptext,
        .register-card .helptext ul {
            color: #999;
            font-size: 12px;
        }

        .register-card ul {
            padding-left: 20px;
        }

        .register-card .errorlist {
            color: #ff7777;
            font-size: 13px;
        }

        .register-btn {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 30px;
            padding: 13px;
            font-weight: 600;
            margin-top: 15px;
        }

        .register-btn:hover {
            background: #dddddd;
        }

        .login-link {
            text-align: center;
            color: #999;
            margin-top: 25px;
        }

        .login-link a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark studentx-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
            StudentX
        </a>
    </div>
</nav>

<section class="register-section">
    <div class="register-card">

        <h1>Join StudentX</h1>

        <p class="register-subtitle">
            Create your account and connect with your campus.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="register-btn">
                Create Account
            </button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">Log in</a>
        </p>

    </div>
</section>

</body>
</html>
